[tool.poetry]
name = "secscan"
version = "0.1.0"
description = "SecScan v0.1 — Application Security Scanner for VAPT engagements"
authors = ["Atharva Sardesai <atharvapsardesai@gmail.com>"]
readme = "README.md"
packages = [{ include = "secscan" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
httpx = "^0.27.0"
playwright = "^1.44.0"
sqlalchemy = { version = "^2.0.30", extras = ["asyncio"] }
alembic = "^1.13.1"
typer = { version = ">=0.12.3", extras = ["all"] }
structlog = "^24.2.0"
asyncpg = "^0.29.0"
anthropic = "^0.28.0"
pydantic = "^2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.7"
vcrpy = "^6.0.1"
pytest-cov = "^5.0.0"

[tool.poetry.scripts]
secscan = "secscan.cli.commands:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=secscan --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
source = ["secscan"]
omit = ["secscan/cli/*", "secscan/models/*", "secscan/utils/*", "secscan/session/auth.py", "secscan/checks/payloads/auth.py", "secscan/checks/payloads/authz.py", "secscan/checks/payloads/jwt.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "@abstractmethod"]
