# secscan.toml — per-target configuration
# Generated by: secscan init --target juice-shop
#
# Secrets (DATABASE_URL, ANTHROPIC_API_KEY, INTERACTSH_URL) live in your
# shell environment or a .env file — never in this file, which may be
# committed to version control.

[target]
name = "juice-shop"

# The base URL of the target application.  Used as the authority when
# constructing absolute URLs from HAR entries that only have a path.
base_url = "http://localhost:3000"

# Optional free-text note about this target (client name, engagement ID, etc.)
notes = ""


[scan]
# Which checks to run.  Remove or comment out checks you don't need.
# Available: sqli, xss, ssrf, authz, redirect, data, headers, auth, jwt
checks = [
  "sqli",
  "xss",
  "ssrf",
  "authz",
  "redirect",
  "data",
  "headers",
  "auth",
  "jwt",
]

# Maximum concurrent requests to the same host.  Lower this for sensitive
# targets or if you're seeing WAF blocks.  Range: 1–20.
max_concurrency = 5

# Target requests-per-second across all concurrent requests to a host.
# The rate limiter enforces this globally, not per-check.
rate_limit_rps = 10

# Set to true to enable LLM triage (requires ANTHROPIC_API_KEY in env).
# When false, only the deterministic triage playbook is generated.
triage = false


[auth]
# Path to the Playwright login script, relative to this config file.
script = "auth_script.py"

# URL pattern that signals a session has expired.  If a response redirects
# to a URL matching this pattern, the session keeper will re-run the auth
# script.  Substring match, case-insensitive.
login_url_pattern = "/login"

# How long a captured session is considered valid before the keeper refreshes
# it proactively (in minutes).  Set to 0 to disable proactive refresh.
session_expiry_minutes = 30


[llm]
# Model to use for LLM triage.  Default is the latest Claude model at build
# time; update this if a newer model is available.
model = "claude-opus-4-5"

# Refuse to send a finding to the LLM if the estimated input token count
# exceeds this threshold.  Protects against runaway cost on large responses.
max_input_tokens = 4000

# Hard character limit applied to request and response bodies before they are
# sent to the LLM.  2048 chars ≈ 500 tokens.
truncation_chars = 2048


[logging]
# Log level: DEBUG, INFO, WARNING, ERROR, CRITICAL
level = "INFO"

# Log format: "console" (coloured human-readable) or "json" (NDJSON for
# log aggregators)
format = "console"
